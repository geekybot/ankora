<!doctype html>
<html lang="en" data-dir="b" data-pal="zinc" data-tone="dark">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#09090b">
<script>try{var a=localStorage.getItem('ankora.accent')||(/[?&]accent=apricot\b/.test(location.search)?'apricot':'');if(a==='apricot')document.documentElement.dataset.accent='apricot'}catch(e){}</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ankora app</title>
<meta name="description" content="Borrow USDC against NEAR on fixed terms, or lend USDC. NEAR testnet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
</head>
<body>
<canvas class="kg" data-kinetic-grid aria-hidden="true"></canvas>
<div id="app" class="app">
  <header class="top">
    <a class="brand" href="/" aria-label="Ankora home"><svg class="logo-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><circle cx="17.5" cy="6.5" r="4.5"/><circle cx="6.5" cy="17.5" r="4.5"/><rect x="13" y="13" width="9" height="9" rx="1.5"/></svg><span>Ankora</span></a>
    <span id="keeper" class="keeper"></span>
    <button class="accent-toggle" type="button" data-accent-toggle aria-label="Switch accent colour"><i></i><i></i></button>
    <button class="wallet-chip" type="button" id="wallet"></button>
  </header>
  <section class="stats" id="stats" aria-label="Pool"></section>
  <main class="main"><div class="screen" id="screen"></div></main>
  <aside class="context" id="context" aria-label="Your account"></aside>
</div>
<section class="toasts" id="toasts" aria-label="Notifications" aria-live="polite"></section>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
